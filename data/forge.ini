; Forge PC settings (this file is never overwritten by updates of Forge PC).

[log]
; debug | info | warn | error (forge.log in this folder)
level = info

[menu]
; key that opens the Forge menu: a USB HID usage / SDL scancode. 73 = Insert, 58-69 = F1-F12
key = 73
font_size = 16

[plugins]
; reload a plugin in game when its dll changes (a rebuilt or replaced plugin); false = off
hot_reload = true

[mods]
; A mod folder is on unless it is listed here as off. The Forge menu (Mods) writes this; switch
; one off by hand with  <Mod folder name> = off
; Game files (romfs) of a mod are not switched by Forge: restart the game for those.

[crash]
; when the game dies after a fault in a plugin (forge.log names it), switch that plugin's mod
; off at the next launch (it can be switched back on in the Forge menu)
auto_disable = false

[trace]
; Logs calls of game functions to trace.log (next to forge.log), no plugin needed. Each line is
; an offset in "main" (addresses between exports differ; offsets don't) and its options:
;   limit=N   lines to write for it (it keeps counting); 0 = unlimited; default 100
;   args=true r0-r3 at entry     ret=true  a line with the return value as well
; The file is watched: edit it while the game runs and the change applies within a second or two.
enabled = false
;0x1C358 = limit=50
;0x2A410 = limit=10, args=true
