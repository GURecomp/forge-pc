; Forge PC settings (this file is never overwritten by updates of Forge PC).

[log]
; debug | info | warn | error (forge.log in this folder)
level = info

[menu]
; key that opens the Forge menu: a USB HID usage / SDL scancode. 73 = Insert, 58-69 = F1-F12
key = 73
font_size = 16

[plugins]
; reload a plugin in game when its dll changes (a rebuilt or replaced plugin); false = off
hot_reload = true
